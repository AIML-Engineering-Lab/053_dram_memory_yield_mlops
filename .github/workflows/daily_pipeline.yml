# ═══════════════════════════════════════════════════════════════
# P053 — Daily Production Pipeline
# ═══════════════════════════════════════════════════════════════
# Previously ran once per real calendar day (cron: 00:00 UTC).
# Cron is disabled after Day 40 completion to prevent further AWS cost.
# Reads current day number from S3 state file, runs that day's
# pipeline on EC2 via Airflow, increments the counter on S3.
#
# Flow per run:
#   1. Read s3://p053-mlflow-artifacts/state/pipeline_state.json
#      → get current_day (starts at 1 after Day 1 training)
#   2. SSH to EC2 → trigger Airflow DAG p053_daily_yield_pipeline
#      with day_number and n_rows params
#   3. Wait for DAG run to succeed (poll every 60s, timeout 4h)
#   4. Airflow pipeline on EC2:
#        a. Generate production data (streaming_data_generator)
#        b. Publish to Kafka
#        c. Spark ETL → parquet on s3
#        d. Drift detection → drift report on S3
#        e. IF drift + rows > threshold → trigger retrain DAG
#        f. Retrain DAG: GPU retrain → canary eval → promote/rollback
#   5. Upload drift report + metrics to S3
#   6. Increment current_day in S3 state file
#   7. If current_day > 40 → mark production run COMPLETE and skip expensive steps
#
# Secrets required (GitHub → Settings → Secrets):
#   EC2_HOST        — public IP of EC2 instance (update when IP changes)
#   EC2_SSH_KEY     — contents of p053-key.pem
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
# ═══════════════════════════════════════════════════════════════

name: Daily Production Pipeline

on:
  # Daily cron disabled after the 40-day production run completed.
  # Re-enable only for a deliberate new run window with budget approval.
  workflow_dispatch:
    # Allow manual trigger with optional day override
    inputs:
      day_override:
        description: 'Override day number (leave empty to use S3 state)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — print plan but do not execute'
        required: false
        default: 'false'

env:
  S3_BUCKET: p053-mlflow-artifacts
  S3_STATE_KEY: state/pipeline_state.json
  EC2_USER: ec2-user
  PROJECT_DIR: /home/ec2-user/053_memory_yield_predictor
  AIRFLOW_URL: http://localhost:8888
  AIRFLOW_USER: admin
  AIRFLOW_PASS: admin
  AWS_REGION: us-west-2
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  daily-pipeline:
    name: Run Day ${{ github.event.inputs.day_override || 'from-state' }}
    runs-on: ubuntu-latest
    timeout-minutes: 480  # 8h max — retrain days need ~3.5h (pipeline ~90min + T4 GPU train ~120min + buffer)

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # ── 2. Configure AWS CLI ─────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── 3. Read pipeline state from S3 ───────────────────────────
      - name: Read pipeline state from S3
        id: state
        run: |
          # Download state file (create default if not exists)
          aws s3 cp "s3://$S3_BUCKET/$S3_STATE_KEY" /tmp/pipeline_state.json \
            --region "$AWS_REGION" 2>/dev/null || echo '{"current_day": 2, "status": "running", "last_run": null, "champion_model": "s3://p053-mlflow-artifacts/models/day1_champion_t4.pt"}' > /tmp/pipeline_state.json

          cat /tmp/pipeline_state.json

          # Parse state
          CURRENT_DAY=$(python3 -c "import json; d=json.load(open('/tmp/pipeline_state.json')); print(d.get('current_day', 2))")
          SIM_STATUS=$(python3 -c "import json; d=json.load(open('/tmp/pipeline_state.json')); print(d.get('status', 'running'))")
          CHAMPION=$(python3 -c "import json; d=json.load(open('/tmp/pipeline_state.json')); print(d.get('champion_model', ''))")

          # Override if manually specified
          if [ -n "${{ github.event.inputs.day_override }}" ]; then
            CURRENT_DAY="${{ github.event.inputs.day_override }}"
            echo "Day overridden to: $CURRENT_DAY"
          fi

          SHOULD_RUN="true"
          if [ "$SIM_STATUS" = "complete" ] || [ "$CURRENT_DAY" -gt 40 ]; then
            SHOULD_RUN="false"
          fi

          echo "current_day=$CURRENT_DAY" >> "$GITHUB_OUTPUT"
          echo "sim_status=$SIM_STATUS" >> "$GITHUB_OUTPUT"
          echo "champion_model=$CHAMPION" >> "$GITHUB_OUTPUT"
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "Day: $CURRENT_DAY | Status: $SIM_STATUS | Champion: $CHAMPION | Should run: $SHOULD_RUN"

      # ── 4. Check if production run is already complete ───────────
      - name: Check production run status
        run: |
          STATUS="${{ steps.state.outputs.sim_status }}"
          DAY="${{ steps.state.outputs.current_day }}"
          SHOULD_RUN="${{ steps.state.outputs.should_run }}"
          if [ "$SHOULD_RUN" != "true" ]; then
            echo "✅ 40-day production run already complete or day is beyond 40. Expensive AWS steps will be skipped."
            exit 0
          fi
          if [ "$STATUS" = "complete" ]; then
            echo "✅ 40-day production run already complete. Nothing to do."
            exit 0
          fi
          if [ "$DAY" -gt 40 ]; then
            echo "✅ Day $DAY > 40 — production run complete."
            exit 0
          fi
          echo "▶ Running Day $DAY / 40"

      # ── 5. Verify EC2 is running, start if stopped ────────────────
      - name: Ensure EC2 is running
        if: steps.state.outputs.should_run == 'true'
        run: |
          # ── Start RDS first (takes ~3-5 min; EC2 wait overlaps it) ──
          RDS_STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier p053-mlflow-db \
            --region "$AWS_REGION" \
            --query 'DBInstances[0].DBInstanceStatus' \
            --output text 2>/dev/null || echo "not-found")
          echo "RDS current status: $RDS_STATUS"
          if [ "$RDS_STATUS" = "stopped" ]; then
            echo "Starting RDS p053-mlflow-db..."
            aws rds start-db-instance \
              --db-instance-identifier p053-mlflow-db \
              --region "$AWS_REGION" 2>/dev/null || true
            echo "RDS start command sent (will become available during EC2 wait)"
          elif [ "$RDS_STATUS" = "available" ]; then
            echo "RDS already available — no action needed"
          else
            echo "RDS status '$RDS_STATUS' — skipping start (may be starting/modifying)"
          fi

          INSTANCE_ID=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters "Name=tag:Name,Values=p053-aws-production" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text 2>/dev/null)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "ERROR: No EC2 instance found with tag Name=p053-aws-production"
            exit 1
          fi

          # Start if stopped
          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)

          if [ "$STATE" = "stopping" ]; then
            echo "EC2 is stopping — waiting for stopped state..."
            aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID" --region "$AWS_REGION"
            STATE="stopped"
          fi

          if [ "$STATE" = "stopped" ]; then
            echo "EC2 is stopped — starting it..."
            aws ec2 start-instances --instance-ids "$INSTANCE_ID" --region "$AWS_REGION"
            STATE="pending"
          fi

          if [ "$STATE" = "pending" ]; then
            echo "Waiting for EC2 status checks to pass..."
            aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID" --region "$AWS_REGION"
          fi

          # Get current IP (can change on restart)
          EC2_IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          echo "EC2 IP: $EC2_IP"
          echo "ec2_ip=$EC2_IP" >> "$GITHUB_OUTPUT"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
        id: ec2

      # ── 6. Open SSH for this GitHub runner ───────────────────────
      - name: Authorize runner SSH ingress
        if: steps.state.outputs.should_run == 'true'
        id: ssh_ingress
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          RUNNER_IP=$(curl -fsSL https://checkip.amazonaws.com | tr -d '\n')
          RUNNER_CIDR="$RUNNER_IP/32"
          SG_ID=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query 'Reservations[0].Instances[0].SecurityGroups[0].GroupId' \
            --output text)

          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_CIDR" \
            --region "$AWS_REGION" 2>/dev/null || true

          echo "runner_cidr=$RUNNER_CIDR" >> "$GITHUB_OUTPUT"
          echo "security_group_id=$SG_ID" >> "$GITHUB_OUTPUT"
          echo "Authorized SSH from $RUNNER_CIDR to $SG_ID"

      # ── 7. Setup SSH key ──────────────────────────────────────────
      - name: Setup SSH key
        if: steps.state.outputs.should_run == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/p053-key.pem
          chmod 600 ~/.ssh/p053-key.pem
          ssh-keyscan -H "${{ steps.ec2.outputs.ec2_ip }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      # ── 8. Trigger Airflow DAG on EC2 ─────────────────────────────
      - name: Trigger daily pipeline DAG on EC2
        if: steps.state.outputs.should_run == 'true'
        id: dag_trigger
        env:
          EC2_IP: ${{ steps.ec2.outputs.ec2_ip }}
          DAY: ${{ steps.state.outputs.current_day }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "[DRY RUN] Would trigger p053_daily_yield_pipeline for Day $DAY on $EC2_IP"
            exit 0
          fi

          echo "Triggering DAG for Day $DAY on EC2 $EC2_IP..."
          RUN_DAY_PREFIX="day_$(printf '%02d' "$DAY")_$(date +%Y%m%d)"
          EXPECTED_RUN_ID="day_$(printf '%02d' "$DAY")_$(date +%Y%m%d)_gh${GITHUB_RUN_ID}_a${GITHUB_RUN_ATTEMPT}"

          echo "Syncing DAG and src code to EC2 $EC2_IP..."
          tar -C "$GITHUB_WORKSPACE" -czf - \
            deploy/airflow/dags \
            deploy/aws/docker-compose-bigdata-aws.yml \
            src \
            | ssh -i ~/.ssh/p053-key.pem -o StrictHostKeyChecking=no \
              ec2-user@"$EC2_IP" \
              "mkdir -p '${{ env.PROJECT_DIR }}' && tar -xzf - -C '${{ env.PROJECT_DIR }}'" \
            >/tmp/p053-code-sync.log 2>&1 || {
              echo "ERROR: Failed to sync workflow-managed code to EC2"
              tail -n 80 /tmp/p053-code-sync.log
              exit 1
            }

          RAW_OUTPUT=$(ssh -i ~/.ssh/p053-key.pem -o StrictHostKeyChecking=no \
            ec2-user@"$EC2_IP" << ENDSSH
          # Ensure Airflow is running
          cd "${{ env.PROJECT_DIR }}"
          COMPOSE_FILE="deploy/aws/docker-compose-bigdata-aws.yml"
          ENV_FILE="deploy/aws/.env"
          EXPECTED_RUN_ID="$EXPECTED_RUN_ID"
          RUN_DAY_PREFIX="$RUN_DAY_PREFIX"
          AIRFLOW_RUNNING=false

          # Required services are not guaranteed to auto-start after EC2 reboot.
          if docker inspect -f '{{.State.Running}}' p053-airflow-web 2>/dev/null | grep -qx true \
            && docker inspect -f '{{.State.Running}}' p053-airflow-scheduler 2>/dev/null | grep -qx true; then
            AIRFLOW_RUNNING=true
          fi

          if [ "\$AIRFLOW_RUNNING" = "true" ]; then
            >&2 echo "Restarting Airflow services to load synced DAG/source code..."
            docker compose -f "\$COMPOSE_FILE" --env-file "\$ENV_FILE" \
              up -d --force-recreate airflow-webserver airflow-scheduler \
              >/tmp/p053-airflow-restart.log 2>&1 || {
                >&2 echo "ERROR: Failed to restart Airflow after code sync"
                >&2 tail -n 80 /tmp/p053-airflow-restart.log
                exit 1
              }
          fi

          if ! docker inspect -f '{{.State.Running}}' p053-airflow-web 2>/dev/null | grep -qx true \
            || ! docker inspect -f '{{.State.Running}}' p053-airflow-scheduler 2>/dev/null | grep -qx true \
            || ! docker inspect -f '{{.State.Running}}' p053-kafka 2>/dev/null | grep -qx true \
            || ! docker inspect -f '{{.State.Running}}' p053-zookeeper 2>/dev/null | grep -qx true; then
            >&2 echo "Workflow services down — starting Kafka + Airflow stack..."
            docker compose -f "\$COMPOSE_FILE" --env-file "\$ENV_FILE" \
              up -d zookeeper kafka airflow-postgres airflow-init airflow-webserver airflow-scheduler \
              >/tmp/p053-compose-start.log 2>&1 || {
                >&2 echo "ERROR: Failed to start Kafka + Airflow stack"
                >&2 tail -n 80 /tmp/p053-compose-start.log
                exit 1
              }
          fi

          if ! docker inspect -f '{{.State.Running}}' p053-mlflow-local 2>/dev/null | grep -qx true \
            && ! docker inspect -f '{{.State.Running}}' p053-mlflow 2>/dev/null | grep -qx true; then
            >&2 echo "MLflow container not running — starting compose mlflow service..."
            docker compose -f "\$COMPOSE_FILE" --env-file "\$ENV_FILE" \
              up -d mlflow >/tmp/p053-mlflow-start.log 2>&1 || {
                >&2 echo "WARNING: Failed to start compose mlflow service"
                >&2 tail -n 40 /tmp/p053-mlflow-start.log
              }
          fi

          recover_kafka_if_stale_broker_id() {
            if docker inspect -f '{{.State.Running}}' p053-kafka 2>/dev/null | grep -qx true; then
              return 0
            fi

            if ! docker ps -a --format '{{.Names}}' | grep -qx p053-kafka; then
              return 0
            fi

            if docker logs --tail 120 p053-kafka 2>&1 | grep -q 'NodeExistsException'; then
              >&2 echo "Detected stale Kafka broker registration in ZooKeeper — clearing /brokers/ids/1 and recreating Kafka..."
              docker exec p053-zookeeper zookeeper-shell localhost:2181 delete /brokers/ids/1 \
                >/tmp/p053-zk-delete.log 2>&1 || true
              docker rm -f p053-kafka >/tmp/p053-kafka-rm.log 2>&1 || true
              docker compose -f "\$COMPOSE_FILE" --env-file "\$ENV_FILE" \
                up -d kafka >/tmp/p053-kafka-restart.log 2>&1 || {
                  >&2 echo "ERROR: Failed to restart Kafka after clearing stale ZooKeeper state"
                  >&2 tail -n 80 /tmp/p053-kafka-restart.log
                  exit 1
                }
            fi
          }

          recover_kafka_if_stale_broker_id

          READY=false
          for attempt in \$(seq 1 18); do
            recover_kafka_if_stale_broker_id
            if docker inspect -f '{{.State.Running}}' p053-airflow-scheduler 2>/dev/null | grep -qx true \
              && docker inspect -f '{{.State.Running}}' p053-kafka 2>/dev/null | grep -qx true \
              && docker inspect -f '{{.State.Running}}' p053-zookeeper 2>/dev/null | grep -qx true \
              && docker exec p053-airflow-scheduler airflow version >/dev/null 2>&1; then
              READY=true
              break
            fi
            sleep 5
          done

          if [ "\$READY" != "true" ]; then
            >&2 echo "ERROR: Kafka/Airflow services did not become ready"
            >&2 docker ps --format 'table {{.Names}}\t{{.Status}}'
            exit 1
          fi

          fail_stale_same_day_runs() {
            STALE_RUN_IDS=\$(docker exec p053-airflow-db psql -U airflow -d airflow -Atqc \
              "select run_id from dag_run where dag_id = 'p053_daily_yield_pipeline' and state = 'running' and run_id like '\${RUN_DAY_PREFIX}%' and run_id <> '\${EXPECTED_RUN_ID}' order by start_date;")

            if [ -z "\$STALE_RUN_IDS" ]; then
              return 0
            fi

            >&2 echo "Found stale same-day DAG runs; failing them before trigger:"
            printf '%s\n' "\$STALE_RUN_IDS" >&2

            for STALE_RUN_ID in \$STALE_RUN_IDS; do
              [ -n "\$STALE_RUN_ID" ] || continue

              PIDS=\$(docker top p053-airflow-scheduler -eo pid,cmd \
                | awk -v run_id="\$STALE_RUN_ID" '\$0 ~ run_id {print \$1}')
              if [ -n "\$PIDS" ]; then
                docker exec p053-airflow-scheduler sh -lc "kill -TERM \$PIDS" \
                  >/tmp/p053-stale-run-kill.log 2>&1 || true
              fi

              docker exec p053-airflow-db psql -U airflow -d airflow -c \
                "update task_instance set state = 'failed', end_date = now() where dag_id = 'p053_daily_yield_pipeline' and run_id = '\${STALE_RUN_ID}' and state = 'running'; update dag_run set state = 'failed', end_date = now() where dag_id = 'p053_daily_yield_pipeline' and run_id = '\${STALE_RUN_ID}';" \
                >/tmp/p053-stale-run-fail.log 2>&1 || {
                  >&2 echo "ERROR: Failed to mark stale DAG run \$STALE_RUN_ID as failed"
                  >&2 tail -n 80 /tmp/p053-stale-run-fail.log
                  exit 1
                }
            done
          }

          # Unpause DAG
          docker exec p053-airflow-scheduler \
            airflow dags unpause p053_daily_yield_pipeline 2>/dev/null

          fail_stale_same_day_runs

          # Trigger with day params
          docker exec p053-airflow-scheduler \
            airflow dags trigger p053_daily_yield_pipeline \
            --conf '{"day_number": $DAY, "n_rows": 5000000}' \
            --run-id "\$EXPECTED_RUN_ID" >/tmp/p053-trigger.log 2>&1 || {
              >&2 echo "ERROR: airflow dags trigger failed"
              >&2 tail -n 80 /tmp/p053-trigger.log
              exit 1
            }

          RUN_EXISTS=\$(docker exec p053-airflow-scheduler \
            airflow dags list-runs -d p053_daily_yield_pipeline --output json 2>/dev/null \
            | python3 -c "import json,sys; run_id='\$EXPECTED_RUN_ID'; runs=json.load(sys.stdin); print(any(r.get('run_id') == run_id for r in runs))" 2>/dev/null || echo false)

          if [ "\$RUN_EXISTS" != "True" ]; then
            >&2 echo "ERROR: Trigger completed but run_id \$EXPECTED_RUN_ID was not found in Airflow metadata"
            exit 1
          fi

          >&2 echo "DAG triggered, run_id=\$EXPECTED_RUN_ID"
          printf '%s\n' "\$EXPECTED_RUN_ID"
          ENDSSH
          )

          RUN_ID=$(printf '%s\n' "$RAW_OUTPUT" | tail -n 1 | tr -d '\r')
          if [ -z "$RUN_ID" ]; then
            echo "ERROR: Could not determine DAG run ID from remote output"
            printf '%s\n' "$RAW_OUTPUT"
            exit 1
          fi

          echo "dag_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "DAG run ID: $RUN_ID"

      # ── 9. Poll DAG run until success/failure (timeout 4h) ────────
      - name: Wait for DAG run to complete
        if: steps.state.outputs.should_run == 'true'
        env:
          EC2_IP: ${{ steps.ec2.outputs.ec2_ip }}
          DAY: ${{ steps.state.outputs.current_day }}
          RUN_ID: ${{ steps.dag_trigger.outputs.dag_run_id }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "[DRY RUN] Skipping poll"
            exit 0
          fi

          echo "Polling DAG run: $RUN_ID (max 240 min, poll every 60s)"

          for attempt in $(seq 1 240); do
            STATE=$(ssh -i ~/.ssh/p053-key.pem -o StrictHostKeyChecking=no \
              ec2-user@"$EC2_IP" \
              "docker exec p053-airflow-scheduler airflow dags list-runs -d p053_daily_yield_pipeline --output json 2>/dev/null | python3 -c \"import json,sys; run_id='$RUN_ID'; runs=json.load(sys.stdin); print(next((r.get('state','unknown') for r in runs if r.get('run_id') == run_id), 'unknown'))\" 2>/dev/null" \
              2>/dev/null || echo "unreachable")

            echo "  [$(date '+%H:%M')] attempt $attempt/240 — state: $STATE"

            if [ "$STATE" = "success" ]; then
              echo "✅ DAG run SUCCESS for Day $DAY"
              break
            elif [ "$STATE" = "failed" ]; then
              echo "❌ DAG run FAILED for Day $DAY"
              # Collect task states and the latest task log before failing
              ssh -i ~/.ssh/p053-key.pem -o StrictHostKeyChecking=no \
                ec2-user@"$EC2_IP" \
                "docker exec p053-airflow-scheduler airflow tasks states-for-dag-run p053_daily_yield_pipeline $RUN_ID 2>/dev/null || true; \
                docker exec p053-airflow-scheduler bash -lc 'find /opt/airflow/logs -path \"*run_id=$RUN_ID*\" -type f | sort | tail -n 1 | xargs -r tail -n 80'" || true
              exit 1
            fi
            sleep 60
          done

          if [ "$STATE" != "success" ]; then
            echo "❌ DAG run timed out after 240 attempts for Day $DAY"
            exit 1
          fi

      # ── 10. Collect results from S3 ───────────────────────────────
      - name: Collect day results from S3
        if: steps.state.outputs.should_run == 'true'
        env:
          DAY: ${{ steps.state.outputs.current_day }}
        run: |
          DAY_PADDED=$(printf '%02d' $DAY)
          DRIFT_KEY_FOUND=""

          artifact_exists() {
            local s3_key="$1"
            aws s3api head-object \
              --bucket "$S3_BUCKET" \
              --key "$s3_key" \
              --region "$AWS_REGION" >/dev/null 2>&1
          }

          echo "=== Drift report for Day $DAY ==="
          DRIFT_FOUND="false"
          for DRIFT_KEY in \
            "drift/day_${DAY_PADDED}/drift_day_${DAY_PADDED}.json" \
            "drift_reports/day_${DAY_PADDED}_drift.json"
          do
            if aws s3 cp "s3://$S3_BUCKET/$DRIFT_KEY" \
              /tmp/drift_report.json --region "$AWS_REGION" 2>/dev/null
            then
              DRIFT_FOUND="true"
              DRIFT_KEY_FOUND="$DRIFT_KEY"
              cat /tmp/drift_report.json
              break
            fi
          done

          if [ "$DRIFT_FOUND" != "true" ]; then
            echo "No drift report found (day may not have produced drift data)"
          fi

          echo ""
          echo "=== Daily artifacts for Day $DAY ==="
          FOUND_ANY_ARTIFACT="false"

          if artifact_exists "data/production/day_${DAY_PADDED}/day_${DAY_PADDED}.parquet"; then
            echo "Production parquet: s3://$S3_BUCKET/data/production/day_${DAY_PADDED}/day_${DAY_PADDED}.parquet"
            FOUND_ANY_ARTIFACT="true"
          fi

          if [ -n "$DRIFT_KEY_FOUND" ]; then
            echo "Drift report: s3://$S3_BUCKET/$DRIFT_KEY_FOUND"
            FOUND_ANY_ARTIFACT="true"
          fi

          if artifact_exists "retrain/day_${DAY_PADDED}/retrain_result.json"; then
            echo "Retrain result: s3://$S3_BUCKET/retrain/day_${DAY_PADDED}/retrain_result.json"
            FOUND_ANY_ARTIFACT="true"
          fi

          if artifact_exists "canary/day_${DAY_PADDED}/canary_result.json"; then
            echo "Canary result: s3://$S3_BUCKET/canary/day_${DAY_PADDED}/canary_result.json"
            FOUND_ANY_ARTIFACT="true"
          fi

          if [ "$FOUND_ANY_ARTIFACT" != "true" ]; then
            echo "No day artifacts found in S3"
          fi

      # ── 11. Increment day counter in S3 ───────────────────────────
      - name: Advance pipeline state in S3
        if: steps.state.outputs.should_run == 'true'
        env:
          DAY: ${{ steps.state.outputs.current_day }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "[DRY RUN] Would advance day from $DAY to $((DAY + 1))"
            exit 0
          fi

          NEXT_DAY=$((DAY + 1))
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Read current state, update day + last_run
          python3 << PYEOF
          import json, os

          with open('/tmp/pipeline_state.json') as f:
              state = json.load(f)

          state['current_day'] = $NEXT_DAY
          state['last_run'] = '$NOW'
          state['last_completed_day'] = $DAY

          if $NEXT_DAY > 40:
              state['status'] = 'complete'
              print(f"🎉 Production run COMPLETE — all 40 days done!")
          else:
              state['status'] = 'running'
              print(f"Advanced: Day $DAY → Day {$NEXT_DAY}")

          with open('/tmp/pipeline_state_new.json', 'w') as f:
              json.dump(state, f, indent=2)
          PYEOF

          # Upload updated state to S3
          aws s3 cp /tmp/pipeline_state_new.json \
            "s3://$S3_BUCKET/$S3_STATE_KEY" \
            --region "$AWS_REGION"
          echo "State updated in S3:"
          cat /tmp/pipeline_state_new.json

      # ── 12. Stop EC2 after every day to avoid idle cost ────────────
      - name: Stop EC2 after day completes
        if: always() && steps.ec2.outputs.instance_id != ''
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
          DAY: ${{ steps.state.outputs.current_day }}
        run: |
          echo "Day $DAY complete — stopping EC2 to avoid idle charges (\$0.526/hr)..."
          aws ec2 stop-instances --instance-ids "$INSTANCE_ID" --region "$AWS_REGION" 2>/dev/null || true
          echo "EC2 stop command sent for $INSTANCE_ID"

          # Stop RDS after every day to avoid idle charges (~$0.024/hr)
          echo "Stopping RDS p053-mlflow-db to avoid idle charges..."
          aws rds stop-db-instance \
            --db-instance-identifier p053-mlflow-db \
            --region "$AWS_REGION" 2>/dev/null || true
          echo "RDS stop command sent (Day $DAY complete)"

      - name: Revoke runner SSH ingress
        if: always() && steps.ssh_ingress.outputs.runner_cidr != ''
        env:
          SG_ID: ${{ steps.ssh_ingress.outputs.security_group_id }}
          RUNNER_CIDR: ${{ steps.ssh_ingress.outputs.runner_cidr }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_CIDR" \
            --region "$AWS_REGION" 2>/dev/null || true
          echo "Revoked SSH access for $RUNNER_CIDR from $SG_ID"


      # ── 13. Collect workflow timings and AWS cost snapshot ───────
      - name: Collect workflow timings and AWS cost snapshot
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 <<'PYEOF'
          import json
          import os
          import urllib.request
          from datetime import datetime
          from pathlib import Path

          def parse_iso(value: str) -> datetime:
            return datetime.fromisoformat(value.replace("Z", "+00:00"))

          def fmt_duration(seconds: float) -> str:
            total = max(int(round(seconds)), 0)
            hours, rem = divmod(total, 3600)
            minutes, secs = divmod(rem, 60)
            if hours:
              return f"{hours}h {minutes}m {secs}s"
            if minutes:
              return f"{minutes}m {secs}s"
            return f"{secs}s"

          timings_html = '<div style="font-size:13px;color:#8b949e">Workflow step timing unavailable for this run.</div>'
          overall_runtime = "N/A"
          completed_steps = "0"

          token = os.environ.get("GH_TOKEN", "")
          api_url = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]

          try:
            request = urllib.request.Request(
              f"{api_url}/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100",
              headers={
                "Authorization": f"Bearer {token}",
                "Accept": "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28",
              },
            )
            with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)

            jobs = payload.get("jobs", [])
            job = jobs[0] if jobs else {}
            rows = []
            earliest = None
            latest = None
            step_count = 0

            for step in job.get("steps", []):
              if step.get("status") != "completed":
                continue
              started_at = step.get("started_at")
              completed_at = step.get("completed_at")
              if not started_at or not completed_at:
                continue
              start_dt = parse_iso(started_at)
              end_dt = parse_iso(completed_at)
              duration = fmt_duration((end_dt - start_dt).total_seconds())
              step_name = step.get("name", "Step")
              step_count += 1
              earliest = start_dt if earliest is None or start_dt < earliest else earliest
              latest = end_dt if latest is None or end_dt > latest else latest
              rows.append(
                f'<tr>'
                f'<td style="padding:6px 0;color:#c9d1d9">{step_name}</td>'
                f'<td style="padding:6px 0;color:#58a6ff;text-align:right;font-family:monospace">{duration}</td>'
                f'</tr>'
              )

            if rows:
              timings_html = (
                '<table width="100%" cellpadding="0" cellspacing="0" style="font-size:13px">'
                + "".join(rows)
                + "</table>"
              )
            if earliest and latest:
              overall_runtime = fmt_duration((latest - earliest).total_seconds())
            completed_steps = str(step_count)
          except Exception as exc:
            timings_html = (
              f'<div style="font-size:13px;color:#8b949e">'
              f'Workflow step timing unavailable: {type(exc).__name__}'
              f'</div>'
            )

          Path("/tmp/workflow_timings.html").write_text(timings_html)
          Path("/tmp/overall_runtime.txt").write_text(overall_runtime)
          Path("/tmp/completed_steps.txt").write_text(completed_steps)
          PYEOF

          START=$(date -u +"%Y-%m-01")
          END=$(date -u -d tomorrow +"%Y-%m-%d")
          COST_PERIOD=$(date -u +"%B %Y")

          if aws ce get-cost-and-usage \
          --region us-east-1 \
          --time-period Start="$START",End="$END" \
          --granularity MONTHLY \
          --metrics UnblendedCost \
          --group-by Type=DIMENSION,Key=SERVICE \
          --output json > /tmp/aws_cost_snapshot.json 2>/tmp/aws_cost_snapshot.err
          then
          python3 <<'PYEOF'
          import json
          from pathlib import Path

          def money(value: float) -> str:
            return f"${value:,.2f}"

          snapshot = json.loads(Path("/tmp/aws_cost_snapshot.json").read_text())
          results = snapshot.get("ResultsByTime", [])
          groups = []
          if results:
            for group in results[0].get("Groups", []):
              service = group.get("Keys", ["Unknown Service"])[0]
              amount = float(group["Metrics"]["UnblendedCost"]["Amount"])
              if amount > 0:
                groups.append((service, amount))

          groups.sort(key=lambda item: item[1], reverse=True)
          total = sum(amount for _, amount in groups)

          if groups:
            rows = []
            for service, amount in groups[:6]:
              rows.append(
                f'<tr>'
                f'<td style="padding:6px 0;color:#c9d1d9">{service}</td>'
                f'<td style="padding:6px 0;color:#fbbf24;text-align:right;font-family:monospace">{money(amount)}</td>'
                f'</tr>'
              )
            costs_html = (
              '<div style="font-size:12px;color:#8b949e;margin-bottom:8px">'
              'Current AWS month-to-date spend from Cost Explorer grouped by service.'
              '</div>'
              '<table width="100%" cellpadding="0" cellspacing="0" style="font-size:13px">'
              + "".join(rows)
              + "</table>"
            )
            total_text = money(total)
          else:
            costs_html = '<div style="font-size:13px;color:#8b949e">No month-to-date AWS cost data returned yet.</div>'
            total_text = "$0.00"

          Path("/tmp/aws_costs.html").write_text(costs_html)
          Path("/tmp/total_mtd_cost.txt").write_text(total_text)
          PYEOF
          else
            printf '%s\n' '<div style="font-size:13px;color:#8b949e">AWS Cost Explorer snapshot unavailable for this run.</div>' > /tmp/aws_costs.html
          echo "Unavailable" > /tmp/total_mtd_cost.txt
          fi

          echo "$COST_PERIOD" > /tmp/cost_period.txt

        # ── 14. Build HTML email body ─────────────────────────────────
      - name: Build HTML email report
        if: always()
        env:
          DAY: ${{ steps.state.outputs.current_day }}
          JOB_STATUS: ${{ job.status }}
          EC2_IP: ${{ steps.ec2.outputs.ec2_ip }}
          CHAMPION: ${{ steps.state.outputs.champion_model }}
        run: |
          STATUS="${{ job.status }}"
          DAY="${{ steps.state.outputs.current_day }}"
          DAY_PADDED=$(printf '%02d' ${DAY:-0})
          NOW=$(date -u +"%B %d, %Y %H:%M UTC")
          NEXT_DAY=$((${DAY:-0} + 1))
          DAYS_LEFT=$((40 - ${DAY:-0}))
          ARTIFACTS_HTML=""

          artifact_exists() {
            local s3_key="$1"
            aws s3api head-object \
              --bucket "$S3_BUCKET" \
              --key "$s3_key" \
              --region "$AWS_REGION" >/dev/null 2>&1
          }

          append_artifact_html() {
            local label="$1"
            local s3_key="$2"
            if artifact_exists "$s3_key"; then
              ARTIFACTS_HTML="${ARTIFACTS_HTML}<div style=\"font-size:13px;color:#c9d1d9;margin-top:8px\"><span style=\"color:#8b949e\">${label}:</span> <span style=\"color:#58a6ff;word-break:break-all;font-family:monospace\">s3://$S3_BUCKET/$s3_key</span></div>"
            fi
          }

          # Read drift report if available
          DRIFT_JSON='{}'
          DRIFT_KEY_FOUND=''
          for DRIFT_KEY in \
            "drift/day_${DAY_PADDED}/drift_day_${DAY_PADDED}.json" \
            "drift_reports/day_${DAY_PADDED}_drift.json"
          do
            DRIFT_JSON_CANDIDATE=$(aws s3 cp "s3://$S3_BUCKET/$DRIFT_KEY" - 2>/dev/null) && {
              DRIFT_JSON="$DRIFT_JSON_CANDIDATE"
              DRIFT_KEY_FOUND="$DRIFT_KEY"
              break
            }
          done

          append_artifact_html "Production parquet" "data/production/day_${DAY_PADDED}/day_${DAY_PADDED}.parquet"
          if [ -n "$DRIFT_KEY_FOUND" ]; then
            append_artifact_html "Drift report" "$DRIFT_KEY_FOUND"
          fi
          append_artifact_html "Retrain result" "retrain/day_${DAY_PADDED}/retrain_result.json"
          append_artifact_html "Canary result" "canary/day_${DAY_PADDED}/canary_result.json"

          if [ -z "$ARTIFACTS_HTML" ]; then
            ARTIFACTS_HTML='<div style="font-size:13px;color:#8b949e;margin-top:8px">No day artifacts found in S3 yet.</div>'
          fi

          DRIFT_DETECTED=$(echo "$DRIFT_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('should_retrain', False))" 2>/dev/null || echo "false")
          PSI_MAX=$(echo "$DRIFT_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d.get('max_psi', 0), 4))" 2>/dev/null || echo "N/A")
          CRITICAL_FEATS=$(echo "$DRIFT_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('features_critical', 0))" 2>/dev/null || echo "0")

          if [ "$STATUS" = "success" ]; then
            STATUS_BG="#1a472a"
            STATUS_BORDER="#22c55e"
            STATUS_TEXT="#22c55e"
            STATUS_ICON="✅"
            STATUS_LABEL="SUCCESS"
            HEADLINE="Day ${DAY} pipeline completed successfully"
          else
            STATUS_BG="#4a1515"
            STATUS_BORDER="#ef4444"
            STATUS_TEXT="#ef4444"
            STATUS_ICON="❌"
            STATUS_LABEL="FAILED"
            HEADLINE="Day ${DAY} pipeline encountered an error — check logs"
          fi

          if [ "$DRIFT_DETECTED" = "True" ]; then
            DRIFT_BADGE='<span style="background:#78350f;color:#fbbf24;padding:3px 10px;border-radius:12px;font-size:13px;font-weight:700">⚠ DRIFT DETECTED</span>'
            if [ "$DAY" -lt 30 ]; then
              DRIFT_STATUS="Drift detected — retrain gated until Day 30 (staleness guard)"
            else
              DRIFT_STATUS="GPU retraining triggered"
            fi
          else
            DRIFT_BADGE='<span style="background:#14532d;color:#22c55e;padding:3px 10px;border-radius:12px;font-size:13px;font-weight:700">✓ NO DRIFT</span>'
            DRIFT_STATUS="Model stable — no retraining needed"
          fi

          python3 << PYEOF
          from pathlib import Path

          day = "$DAY"
          next_day = "$NEXT_DAY"
          days_left = "$DAYS_LEFT"
          status_bg = "$STATUS_BG"
          status_border = "$STATUS_BORDER"
          status_text = "$STATUS_TEXT"
          status_icon = "$STATUS_ICON"
          status_label = "$STATUS_LABEL"
          headline = "$HEADLINE"
          drift_badge = """$DRIFT_BADGE"""
          drift_status = "$DRIFT_STATUS"
          psi_max = "$PSI_MAX"
          critical_feats = "$CRITICAL_FEATS"
          champion = "$CHAMPION"
          now = "$NOW"
          ec2_ip = "$EC2_IP"
          artifacts_html = """$ARTIFACTS_HTML"""
          overall_runtime = Path('/tmp/overall_runtime.txt').read_text().strip() if Path('/tmp/overall_runtime.txt').exists() else 'N/A'
          completed_steps = Path('/tmp/completed_steps.txt').read_text().strip() if Path('/tmp/completed_steps.txt').exists() else '0'
          total_mtd_cost = Path('/tmp/total_mtd_cost.txt').read_text().strip() if Path('/tmp/total_mtd_cost.txt').exists() else 'Unavailable'
          cost_period = Path('/tmp/cost_period.txt').read_text().strip() if Path('/tmp/cost_period.txt').exists() else ''
          timings_html = Path('/tmp/workflow_timings.html').read_text() if Path('/tmp/workflow_timings.html').exists() else '<div style="font-size:13px;color:#8b949e">No workflow timing data captured.</div>'
          aws_costs_html = Path('/tmp/aws_costs.html').read_text() if Path('/tmp/aws_costs.html').exists() else '<div style="font-size:13px;color:#8b949e">No AWS cost snapshot captured.</div>'
          run_url = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          pct = int(day) * 100 // 40

          html = f"""<!DOCTYPE html>
          <html>
          <head><meta charset="utf-8"></head>
          <body style="margin:0;padding:0;background:#0d1117;font-family:'Segoe UI',Arial,sans-serif">
          <table width="100%" cellpadding="0" cellspacing="0" style="background:#0d1117;padding:24px 0">
          <tr><td align="center">
          <table width="620" cellpadding="0" cellspacing="0" style="background:#161b22;border-radius:12px;overflow:hidden;border:1px solid #30363d">

            <!-- Header -->
            <tr><td style="background:linear-gradient(135deg,#1e3a5f 0%,#0d1b2e 100%);padding:28px 32px;text-align:center">
              <div style="font-size:13px;color:#58a6ff;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">P053 — DRAM Memory Yield MLOps</div>
              <div style="font-size:26px;font-weight:700;color:#f0f6fc">Daily Production Pipeline</div>
              <div style="font-size:14px;color:#8b949e;margin-top:6px">{now}</div>
            </td></tr>

            <!-- Status Banner -->
            <tr><td style="padding:20px 32px 0">
              <div style="background:{status_bg};border:1px solid {status_border};border-radius:10px;padding:16px 20px;text-align:center">
                <div style="font-size:24px;font-weight:800;color:{status_text}">{status_icon} {status_label}</div>
                <div style="font-size:14px;color:#c9d1d9;margin-top:6px">{headline}</div>
              </div>
            </td></tr>

            <!-- Progress Bar -->
            <tr><td style="padding:20px 32px 0">
              <div style="font-size:12px;color:#8b949e;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px">Production Run Progress — Day {day} of 40</div>
              <div style="background:#21262d;border-radius:6px;height:16px;overflow:hidden">
                <div style="background:linear-gradient(90deg,#1d4ed8,#3b82f6);height:16px;width:{pct}%;border-radius:6px;transition:width 0.3s"></div>
              </div>
              <div style="display:flex;justify-content:space-between;margin-top:6px">
                <span style="font-size:12px;color:#3b82f6;font-weight:700">{pct}% complete</span>
                <span style="font-size:12px;color:#8b949e">{days_left} days remaining</span>
              </div>
            </td></tr>

            <!-- Metrics Grid -->
            <tr><td style="padding:20px 32px 0">
              <table width="100%" cellpadding="0" cellspacing="8">
              <tr>
                <td width="33%" style="background:#21262d;border-radius:8px;padding:14px;text-align:center;border:1px solid #30363d">
                  <div style="font-size:28px;font-weight:800;color:#58a6ff">{day}</div>
                  <div style="font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-top:4px">Current Day</div>
                </td>
                <td width="33%" style="background:#21262d;border-radius:8px;padding:14px;text-align:center;border:1px solid #30363d">
                  <div style="font-size:28px;font-weight:800;color:#f0883e">{psi_max}</div>
                  <div style="font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-top:4px">Max PSI Score</div>
                </td>
                <td width="33%" style="background:#21262d;border-radius:8px;padding:14px;text-align:center;border:1px solid #30363d">
                  <div style="font-size:28px;font-weight:800;color:#e879f9">{critical_feats}</div>
                  <div style="font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-top:4px">Critical Features</div>
                </td>
              </tr>
              </table>
            </td></tr>

            <!-- Runtime + Cost Cards -->
            <tr><td style="padding:16px 32px 0">
              <table width="100%" cellpadding="0" cellspacing="8">
              <tr>
                <td width="50%" style="background:#21262d;border-radius:8px;padding:14px;text-align:center;border:1px solid #30363d">
                  <div style="font-size:28px;font-weight:800;color:#22c55e">{overall_runtime}</div>
                  <div style="font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-top:4px">Workflow Runtime</div>
                  <div style="font-size:12px;color:#8b949e;margin-top:4px">{completed_steps} completed steps</div>
                </td>
                <td width="50%" style="background:#21262d;border-radius:8px;padding:14px;text-align:center;border:1px solid #30363d">
                  <div style="font-size:28px;font-weight:800;color:#fbbf24">{total_mtd_cost}</div>
                  <div style="font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-top:4px">AWS MTD Spend</div>
                  <div style="font-size:12px;color:#8b949e;margin-top:4px">{cost_period or 'Current month'}</div>
                </td>
              </tr>
              </table>
            </td></tr>

            <!-- Drift Status -->
            <tr><td style="padding:16px 32px 0">
              <div style="background:#21262d;border:1px solid #30363d;border-radius:8px;padding:14px 18px">
                <div style="font-size:13px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Drift Detection</div>
                <div>{drift_badge}</div>
                <div style="font-size:14px;color:#c9d1d9;margin-top:8px">{drift_status}</div>
              </div>
            </td></tr>

            <!-- Workflow Step Timings -->
            <tr><td style="padding:16px 32px 0">
              <div style="background:#21262d;border:1px solid #30363d;border-radius:8px;padding:14px 18px">
                <div style="font-size:13px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Workflow Step Timings</div>
                {timings_html}
              </div>
            </td></tr>

            <!-- AWS Cost Snapshot -->
            <tr><td style="padding:16px 32px 0">
              <div style="background:#21262d;border:1px solid #30363d;border-radius:8px;padding:14px 18px">
                <div style="font-size:13px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">AWS Cost Snapshot — {cost_period or 'Current month'}</div>
                {aws_costs_html}
              </div>
            </td></tr>

            <!-- Today's Activities -->
            <tr><td style="padding:16px 32px 0">
              <div style="background:#21262d;border:1px solid #30363d;border-radius:8px;padding:14px 18px">
                <div style="font-size:13px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Today's Pipeline Activities</div>
                <table width="100%" cellpadding="4" cellspacing="0" style="font-size:13px;color:#c9d1d9">
                  <tr><td style="color:#22c55e;padding-right:10px">→</td><td>Generated 5M rows synthetic DRAM production data</td></tr>
                  <tr><td style="color:#22c55e;padding-right:10px">→</td><td>Published events to Kafka topic <code style="color:#58a6ff">yield-events</code></td></tr>
                  <tr><td style="color:#22c55e;padding-right:10px">→</td><td>Spark ETL processed batch → Parquet on S3</td></tr>
                  <tr><td style="color:#22c55e;padding-right:10px">→</td><td>PSI drift detection run against baseline (Days 1-8)</td></tr>
                  <tr><td style="color:{"#fbbf24" if "Drift detected" in drift_status else ("#ef4444" if "retraining triggered" in drift_status else "#6b7280")};padding-right:10px">→</td>
                      <td>{drift_status if drift_status != "Model stable — no retraining needed" else "No retraining needed — champion model retained"}</td></tr>
                  <tr><td style="color:#22c55e;padding-right:10px">→</td><td>Artifacts uploaded to S3</td></tr>
                </table>
              </div>
            </td></tr>

            <!-- Champion Model -->
            <tr><td style="padding:16px 32px 0">
              <div style="background:#21262d;border:1px solid #30363d;border-radius:8px;padding:14px 18px">
                <div style="font-size:13px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Champion Model</div>
                <div style="font-size:13px;color:#58a6ff;word-break:break-all;font-family:monospace">{champion or "s3://p053-mlflow-artifacts/models/day1_champion_t4.pt"}</div>
              </div>
            </td></tr>

            <!-- Day Artifacts -->
            <tr><td style="padding:16px 32px 0">
              <div style="background:#21262d;border:1px solid #30363d;border-radius:8px;padding:14px 18px">
                <div style="font-size:13px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Day Artifacts</div>
                {artifacts_html}
              </div>
            </td></tr>

            <!-- Next Steps -->
            <tr><td style="padding:16px 32px 0">
              <div style="background:#0d2137;border:1px solid #1d4ed8;border-radius:8px;padding:14px 18px">
                <div style="font-size:13px;color:#58a6ff;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">⏭ Tomorrow — Day {next_day}</div>
                <div style="font-size:13px;color:#c9d1d9">GitHub Actions cron triggers at 00:00 UTC · {"~2h (inference only)" if int(day)+1 < 30 else "~7.5h (retrain day expected near Day 30)"}</div>
              </div>
            </td></tr>

            <!-- Footer -->
            <tr><td style="padding:20px 32px 24px">
              <div style="text-align:center">
